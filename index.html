<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator </title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <div class="container">
        <header>
          <h1>CHIP-8 Emulator</h1>
          <p>Upload a <code>.ch8</code> ROM or choose a present test ROM </p>
        </header>

        <div class="control-section">
           <div classs="control-group">
             <label for="rom-select">Preset Test ROMs:</label>
             <select id="rom-select">
                <option value="">---- Select Test ROM ----</option>
                <option value="roms/1-chip8-logo.ch8">1. CHIP-8 Logo </option>
                <option vlaue="roms/2-ibm-logo.ch8">2. IBM Logo Test</option>
                <option value="roms/3-corax+.ch8">3/ Corax89 Opcode Test</option>
                <option value="roms/4-flags.ch8">4. Flags Test</option>
                <option value="roms/5-quirks.ch8">5. Quirks Test</option>
                <option value="roms/6-keypad.ch8">6. Keypad Test</option>
             </select>
           </div>

           <div class="control-group">
              <label for="rom-upload">Upload File:</label>
              <input type="file" id="rom-upload"  accept=".ch8">
           </div>
        </div>
      
         <div class="emu-wrapper">
            <canvas id="chip8-canvas" width="640" height="320"></canvas>
         </div>
       <div class="keypad-section">
          <div class="keypad-head">
            <span>Keypad Layout:</span>
            <div class="layout-toggle">
               <button id="btn-vip" class="toggle btn active">COSMAC VIP (Retro Hex)</button>
               <button id="btn-qwerty" class="toggle-btn">Modern QWERTY</button> 
            </div>
          </div>
          <div id="keypad-grid" class="keypad-grid vip-mode"></div>
       </div>
        <script src="chip8.js"></script>
        <script src="main.js"></script>
    </body>
    </html>
